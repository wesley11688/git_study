<body>
  <h1>Git-的三個區域</h1>
  <h2>Git使用時：工作區 -> 暫存區 -> 版本庫</h2>
  <br>
  <h2>
    工作區：實際開發時操作的文件夾『 git_study 』<br>
    命令：git add 文件名 (將文件加入暫存區)
  </h2><br>
  <h2>
    暫存區：保存之前的準備區域(暫存改動過的文件)『 .git/index 』<br>
    命令：git add . (暫存所有改動)
    查看暫存區命令：git ls-files
  </h2><br>
  <h2>版本庫：提交並保存暫存區的內容，產生一個版本快照『 .git/objects 』<br>
    命令：git commit -m "提交訊息" (提交暫存區)
  </h2>
  <h2>
    查看日誌命令：git log --oneline
  </h2><br>

</body>

</html>
