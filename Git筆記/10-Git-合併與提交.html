  <h1>Git-分支合併與提交</h1><br>
  <h2>合併提交：發生於原分之產生了新的提交紀錄後，在合併回去時發生，自動使用多個快照紀錄合併後產生新的提交</h2>
  <h2>合併命令：git merge 分支名</h2><br>
  <h2>提交命令：git commit -m "提交訊息"</h2>
