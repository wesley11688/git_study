<body>
  <h1>Git-初識</h1>
  <h2>概念：一個免費開源，分布式的代碼版本控制系統，幫助開發團隊維護代碼</h2>
  <h2>作用：紀錄代碼內容，切換代碼版本，多人開發時高效合併代碼內容</h2>
  <h2>配置：用戶名和郵箱，應用在每次提交代碼版本時表明自己的身份</h2>
  <h2>命令：<br>
    git config --global user.name "xuan"<br>
    git config --global user.email "wesley11688@gmail.com"<br>
  </h2>
  <h2>
    查看配置：<br>
    git config --list<br>
  </h2>
  <h2>更改：如需更改在執行一次命令即可<br>
    git config --global user.name "新的名字"<br>
  </h2>

</body>

</html>
