<body>
  <h1>Git-忽略文件</h1>
  <h2>概念： .gitignore 文件可以讓Git徹底忽略跟蹤指定文件</h2>
  <h2>目的：讓Git更小更快，避免無意義的文件重複管理</h2>
  <h2>例如：<br>
    1.系統或軟件自動生成的軟件，例如npm下載的node_modules<br>
    2.編譯產生的結果文件，例如webpack打包的dist<br>
    3.運行時生成的日誌文件，緩存文件，臨時文件等<br>
    4.涉密文件，密碼，密鑰等文件<br>
  </h2>
</body>

</html>
