  <h1>Git-常用分支</h1>
  <!-- 命令.                       作用                    注意   -->
  <!-- git -v                     查看Git版本              無     -->
  <!-- git init                   創建Git倉庫              無     -->
  <!-- git add 文件標示            暫存某個文件              文件標示以終端為起始的相對路徑-->
  <!-- git add .                  暫存所有文件              無      -->
  <!-- git commit -m "說明註釋"    提交版本紀錄              每次提交，把暫存區內容快照一份 -->
  <!-- git status                 查看文件狀態-詳細信息      無      -->
  <!-- git status -s              查看文件狀態-簡略信息      第一列是暫存區裝態，第二列是工作區-->
  <!-- git ls-files               查看暫存區文件列表         無      -->
  <!-- git restore 文件標示        將暫存區文件還原到工作區    件標示以終端為起始的相對路徑 -->
  <!-- git rm --cached 文件標示    從暫存區移除文件           文件標示以終端為起始的相對路徑-->
  <!-- git log                    查看版本紀錄              無 -->
  <!-- git log --oneline          查看版本紀錄-簡略信息       無 -->
  <!-- git reflog --oneline       查看完整歷史-簡略消息       包括提交，切換，回退等所有紀錄 -->
  <!-- git reset -- soft 版本號.  切換版本代碼到暫存區和工作區  sort--模式保留暫存區和工作區原本內容 -->
  <!-- git reset -- hard 版本號.  切換版本代碼到暫存區和工作區  hard--模式『不』保留暫存區和工作區原本內容 -->
  <!-- git resrt mixed 版本號.    切換版本代碼到暫存區和工作區  mixed--模式不保留暫存區，保留工作區原本內容 -->
  <!-- git branch 分支名           創建分支                  無 -->
  <!-- git branch                 查看分支                  無 -->
  <!-- git branch -d 分支名        刪除分支                  無 -->
  <!-- git checkout 分支名         切換分支                  無 -->
  <!-- git checkout -b 分支名      創建分支並切換分支          無 -->
  <!-- git merge 分支名              合併分支                  無 -->
