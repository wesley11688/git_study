<body>
  <h1>Git-文件狀態</h1><br>
  <h2>未跟蹤：新文件，從未被Git管理過</h2>
  <h2>已跟蹤：已經被Git管理過 </h2>
  <p>未跟蹤(U) -> 概念：從未被Git管理過 -> 場景：新文件 </p>
  <p>新添加(A) -> 概念：第一次被Git管理 -> 場景：之前版本紀錄從未有文件 </p>
  <p>未修改('')-> 概念：三個區域統一 -> 場景：提交後保存 </p>
  <p>已修改(M) -> 概念：工作區內容變化 -> 場景：修改了內容產生 </p>
  <br>
  <p>查看暫存區文件命令: git status -s </p>


</body>

</html>
