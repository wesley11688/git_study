<body>
  <h1>Git-分支</h1>
  <h2>概念：本質上是指向提交節點的可變指針，默認名字是master</h2>

  <h2>場景：開發新需求/修復Bug，保證主線代碼隨時可用，多人協同開發提高效率</h2><br>

  <h2>創建分支命令：git branch 分支名</h2><br>
  <h2>創建分支時會以head指針作為起點，把新的分支指向這個起點</h2><br>
  <h2>查看有哪些分支的命令：git branch</h2>

  <h2>切換分支命令：git checkout 分支名</h2><br>
  <h2>由於剛創建好的分支並不會自動切換，所以再次使用git checkout命令切換</h2>
