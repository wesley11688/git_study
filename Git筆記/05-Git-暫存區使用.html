  <h1>Git-暫存區使用</h1>
  <h2>暫存區：暫時存儲，可以臨時恢復代碼內容，與版本解耦</h2>
  <h2>git restore --staged 只操作暂存区，不会碰工作区：<br>
    它把文件从「暂存区」移回「未暂存」状态<br>
    工作区的文件内容完全不受影响（不会被覆盖）</h2><br>
  <h2>從暫存區移除文件命令：git rm --cached 文件名</h2>
