<body>
  <h1>Git-分支的合併衝突</h1>
  <h2>需求1：基於master新建publish分支，完成發布文章業務，然後修改內容頁面的html的title標籤，並提交一次</h2>
  <h2>需求2：切換到master，也在修改內容頁面的html的title標籤，並提交一次</h2>
  <h2>衝突：把publish分支合併到master回來，產生合併衝突</h2>
  <h2>概念：不同分支中，對同一個文件的同一部分修改，Git無法乾淨的合併，產生合併衝突</h2>
  <h2>解決方法：<br>
    1.打開vs code 找到衝突文件並手動解決<br>
    2.解決後需要提交一次紀錄
  </h2>
</body>

</html>
