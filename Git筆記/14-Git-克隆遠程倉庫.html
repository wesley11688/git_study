<body>
  <h1>Git-克隆遠程倉庫</h1>

  <h2>目標：拷貝一個遠程倉庫到本地使用</h2>
  <h2>命令：git clone 遠程倉庫原點地址，例如：git clone https://github.com/xxx/xxx.git</h2>
  <h2>效果：在運行命令所在文件夾，生成work文件夾(包含版本庫，並映射到暫存區和工作區)</h2>
  <h2>注意1：Git本地倉庫和遠程倉庫已經建立好鏈接</h2>
  <h2>注意2：倉庫公開隨時克隆，推送需要倉庫團隊人員</h2>
  <h2>克隆分支命令：cd 倉庫名稱/</h2>
</body>
